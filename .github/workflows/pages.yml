name: Build, validate and publish observability book
on:
  push:
    branches: [main]
    paths: ['book/**', 'scripts/**', 'web/**', 'epub/**', 'lab/**', 'tests/**', '.github/workflows/**', 'README.md', 'LICENSE*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observability-pages
  cancel-in-progress: true
jobs:
  experiment:
    uses: ./.github/workflows/lab.yml
  build:
    needs: experiment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.12.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: observability-evidence
          path: .build-evidence
      - name: Build same manuscript as EPUB and static pages
        run: python3 scripts/build.py
      - name: Validate EPUB 3
        run: sh scripts/epubcheck.sh
      - name: Attach actual experiment evidence from this commit
        run: python3 scripts/package_evidence.py
      - name: Verify source, full text, navigation and resources
        run: python3 scripts/verify.py
      - name: Install browser tools
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify reader and all chapters at 320/390px
        run: |
          python3 -m http.server 8771 --bind 127.0.0.1 --directory site > /tmp/book-http.log 2>&1 &
          BOOK_URL=http://127.0.0.1:8771/ node scripts/browser-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: book-downloads
          path: site/downloads/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
