<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620"><rect width="960" height="620" rx="16" fill="#f7f7f3"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#28685c"/></marker></defs><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#292e34"><text x="40" y="48" font-size="28" font-weight="650">保留因果身份，而不只匹配业务对象</text><rect x="40" y="100" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="155.0" y="136" text-anchor="middle" font-size="24">HTTP server</text><text x="155.0" y="165" text-anchor="middle" font-size="16" fill="#626b74">入口 trace ID</text><rect x="365" y="100" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="480.0" y="136" text-anchor="middle" font-size="24">producer span</text><text x="480.0" y="165" text-anchor="middle" font-size="16" fill="#626b74">注入 traceparent</text><rect x="690" y="100" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="805.0" y="136" text-anchor="middle" font-size="24">consumer span</text><text x="805.0" y="165" text-anchor="middle" font-size="16" fill="#626b74">提取为 parent</text><path d="M270 145H365" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M595 145H690" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="300" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="155.0" y="336" text-anchor="middle" font-size="24">相同订单号</text><text x="155.0" y="365" text-anchor="middle" font-size="16" fill="#626b74">业务仍可成功</text><rect x="365" y="300" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="480.0" y="336" text-anchor="middle" font-size="24">省略消息上下文</text><text x="480.0" y="365" text-anchor="middle" font-size="16" fill="#626b74">propagate=false</text><rect x="690" y="300" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="805.0" y="336" text-anchor="middle" font-size="24">新 root trace</text><text x="805.0" y="365" text-anchor="middle" font-size="16" fill="#626b74">技术身份断开</text><path d="M270 345H365" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M595 345H690" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="475" font-size="24">正例：trace ID 相同，consumer.parent = producer.span_id。</text><text x="40" y="530" font-size="24">负例：业务已处理，但消费者位于独立 trace。</text></g></svg>