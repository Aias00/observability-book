edis</text><path d="M480 185V255" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M595 300H690" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M805 255V185" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="440" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="155.0" y="476" text-anchor="middle" font-size="24">Collector</text><text x="155.0" y="505" text-anchor="middle" font-size="16" fill="#626b74">接收 Java SDK OTLP</text><rect x="365" y="440" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="480.0" y="476" text-anchor="middle" font-size="24">Tempo</text><text x="480.0" y="505" text-anchor="middle" font-size="16" fill="#626b74">trace 查询</text><rect x="690" y="440" width="230" height="90" rx="12" fill="#fffefa" stroke="#8ca79b" stroke-width="2"/><text x="805.0" y="476" text-anchor="middle" font-size="24">Prometheus</text><text x="805.0" y="505" text-anchor="middle" font-size="16" fill="#626b74">指标 / exemplar / 告警</text><path d="M270 485H365" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><path d="M155 530V555H805V530" fill="none" stroke="#28685c" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="390" font-size="20">三个 Java 角色在同一 JVM；业务依赖与遥测后端为真实连接。</text><text x="40" y="580" font-size="18" fill="#626b74">下排为查询关系概览；Prometheus 主动抓取 Collector 暴露的指标。</text></g></svg>